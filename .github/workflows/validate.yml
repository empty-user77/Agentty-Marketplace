name: Validate

# Every pull request is someone asking Agentty to offer their plugin to everyone. Three things are
# asked of it, in order of how much they cost: the entry is read, the module behind it is
# downloaded and weighed against the checksum, and the source it names is built again from scratch
# and weighed against the same checksum. The last one is what makes the first two mean anything —
# without it an entry is a binary with a promise attached.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  entries:
    name: The entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The checks themselves still work
        run: python3 -m unittest discover -s scripts -q
      - name: Every entry
        run: python3 scripts/validate.py
      # Only on a pull request: on main the modules were fetched when the entry landed, and a
      # release that disappears later should not turn the whole list red.
      - name: Every module, against its checksum
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate.py --download
      - name: Every source, readable by anyone
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate.py --source
      - name: index.json matches the entries
        run: |
          python3 scripts/validate.py --index
          git diff --exit-code index.json || {
            echo "::error::index.json is out of date - run: python3 scripts/validate.py --index"
            exit 1
          }

  built-from-source:
    name: Built from the source it names
    # The entry has to make sense before there is any point building it.
    needs: entries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both sides of the pull request, so the entries it actually touches can be found.
          fetch-depth: 0

      # This runs once, at registration or update — never on a schedule. A pull request usually
      # changes one entry, and rebuilding the whole list on every one of them would make the cost
      # of checking a plugin grow with how many others are already in the marketplace, forever.
      # The trade-off: a source that goes away, is rewritten or turns private after its pull
      # request merged is not re-checked on its own.
      - name: Which entries this pull request touches
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only --diff-filter=d "$BASE" "$HEAD" -- 'plugins/*.json' \
            | grep -v '/_' || true)"
          # The scripts, the SDK and the plugins published here all change what comes out of a
          # build, so a change to any of them means the whole list is rebuilt.
          if git diff --name-only "$BASE" "$HEAD" -- scripts src sdk | grep -q .; then
            changed="$(ls plugins/*.json | grep -v '/_')"
            echo "A script, the SDK or a published plugin changed: rebuilding every entry."
          fi
          {
            echo "entries<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$changed" ]; then
            echo "No entry changed."
          else
            echo "$changed"
          fi

      - name: Build each one again and compare it to its checksum
        if: steps.touched.outputs.entries != ''
        run: |
          # Unquoted on purpose: one path per line, and an entry path has no spaces in it.
          python3 scripts/verify_build.py ${{ steps.touched.outputs.entries }}
