[package]
name = "social-agentos"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "An AgentOS for posting: read the room, draft, and publish through the browser you are already signed in to"

# Built for wasm32-unknown-unknown, not with Agentty.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agentty-plugin = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
